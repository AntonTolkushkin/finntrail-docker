date.timezone = ${TZ}

display_errors = On
display_startup_errors = On
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 512M
max_execution_time = 300
max_input_time = 60
post_max_size = 1024M
upload_max_filesize = 1024M

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

session.save_handler = redis
session.save_path = "tcp://redis:6379?auth=${REDIS_PASSWORD}&database=1&prefix=PHPREDIS_SESSION:"
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
redis.session.locking_enabled = 1
redis.session.lock_retries = 100
redis.session.lock_wait_time = 20000

upload_tmp_dir = /opt/.bx_temp
sys_temp_dir = /opt/.bx_temp
