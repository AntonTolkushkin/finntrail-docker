date.timezone = ${TZ}

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = 300
max_input_time = 120
max_input_vars = 10000
post_max_size = 1024M
upload_max_filesize = 1024M

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 100000
opcache.jit = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 120

session.save_handler = redis
session.save_path = "tcp://redis:6379?auth=${REDIS_PASSWORD}&database=1&prefix=PHPREDIS_SESSION:"
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
redis.session.locking_enabled = 1
redis.session.lock_retries = 100
redis.session.lock_wait_time = 20000

upload_tmp_dir = /opt/.bx_temp
sys_temp_dir = /opt/.bx_temp
