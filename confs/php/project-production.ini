date.timezone = ${TZ}

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = 300
max_input_time = 120
max_input_vars = 10000
post_max_size = 1024M
upload_max_filesize = 1024M

# Bitrix and Marketplace can change PHP files at runtime. Timestamp validation
# avoids stale code after an update; restart php after large deployments anyway.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 100000
opcache.jit = 0

realpath_cache_size = 8192K
realpath_cache_ttl = 600

session.save_handler = redis
session.save_path = "tcp://redis:6379?auth=${REDIS_PASSWORD}&database=1&prefix=PHPREDIS_SESSION:"

session.use_cookies = 1
session.use_only_cookies = 1
session.use_strict_mode = 1

session.cookie_lifetime = 0
session.cookie_path = "/"
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

session.gc_maxlifetime = 604800

redis.session.locking_enabled = 1
redis.session.lock_retries = 3000
redis.session.lock_wait_time = 20000

upload_tmp_dir = /opt/.bx_temp
sys_temp_dir = /opt/.bx_temp

redis.session.lock_expire = 300
