# Определяем исходную схему запроса. В production Traefik передаёт
# X-Forwarded-Proto, а при прямом локальном доступе используется $scheme.
map $http_x_forwarded_proto $effective_scheme {
    default $scheme;
    http http;
    https https;
}

map $effective_scheme $fastcgi_https {
    default off;
    https on;
}

map $effective_scheme $effective_server_port {
    default $server_port;
    https 443;
}
