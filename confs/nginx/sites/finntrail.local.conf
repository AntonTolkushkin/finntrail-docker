# HTTP нужен для healthcheck и перенаправления браузера на локальный HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name finntrail.local;

    location = /docker-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://finntrail.local$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name finntrail.local;

    include /etc/nginx/ssl/ssl.conf;
    include /etc/nginx/inc/bitrix-server.conf;
}
