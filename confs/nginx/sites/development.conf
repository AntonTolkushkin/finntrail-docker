server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /docker-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.finntrail.ru dev1.finntrail.ru dev2.finntrail.ru;

    auth_basic "Finntrail development";
    auth_basic_user_file /etc/nginx/auth/dev.htpasswd;
    add_header_inherit merge;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Cache-Control "no-store" always;

    include /etc/nginx/inc/finntrail-common.conf;
    include /etc/nginx/inc/bitrix-server.conf;
}
