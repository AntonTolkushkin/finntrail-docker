# TLS termination and HTTP->HTTPS redirect are performed by the host Nginx or
# Traefik. The container receives HTTP with X-Forwarded-Proto=https.
map $http_user_agent $finntrail_bot_limit_key {
    default "";
    ~*(spider|YaDirectFetcher) $binary_remote_addr;
}

limit_req_zone $finntrail_bot_limit_key zone=finntrail_bots:10m rate=3r/s;

server {
    listen 80;
    listen [::]:80;
    server_name www.finntrail.ru;

    location = /docker-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://finntrail.ru$request_uri;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name finntrail.ru;

    client_max_body_size 1024m;
    add_header_inherit merge;
    limit_req zone=finntrail_bots burst=10 nodelay;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Existing short marketing links retained from the current host config.
    location = /x/  { return 302 /?roistat=sms_24.11.25&utm_source=sms&utm_medium=sms&utm_campaign=bonuce_24.11.25; }
    location = /df/ { return 302 /sales/?roistat=sms_28.11.25&utm_source=sms&utm_medium=sms&utm_campaign=sale_28.11.25; }
    location = /gm/ { return 302 /sales/?roistat=sms_15.12.25&utm_source=sms&utm_medium=sms&utm_campaign=bn_15.12.25; }
    location = /ch/ { return 302 /?roistat=sms_15.12.25&utm_source=sms&utm_medium=sms&utm_campaign=bn_15.12.25; }
    location = /ev/ { return 302 /?roistat=sms_16.12.25&utm_source=sms&utm_medium=sms&utm_campaign=bn_16.12.25; }

    include /etc/nginx/inc/finntrail-common.conf;
    include /etc/nginx/inc/bitrix-server.conf;
}
