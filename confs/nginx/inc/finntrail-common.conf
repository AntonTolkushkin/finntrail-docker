# Security headers are returned for both static files and PHP responses.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# This endpoint is intentionally not public.
location = /local/ajax/digilayer_cartstate.php {
    return 403;
}

# Mobile deep-link verification files.
location = /.well-known/apple-app-site-association {
    auth_basic off;
    default_type application/json;
    try_files $uri =404;
    access_log off;
}

location = /.well-known/assetlinks.json {
    auth_basic off;
    default_type application/json;
    try_files $uri =404;
    access_log off;
}

location ^~ /.well-known/ {
    deny all;
}

# Unity/WebGL precompressed build files need explicit encoding and MIME types.
location ~* ^/game/Build/.*\.js\.gz$ {
    add_header Content-Encoding gzip;
    default_type application/javascript;
    try_files $uri =404;
}

location ~* ^/game/Build/.*\.data\.gz$ {
    add_header Content-Encoding gzip;
    default_type application/octet-stream;
    try_files $uri =404;
}

location ~* ^/game/Build/.*\.wasm\.gz$ {
    add_header Content-Encoding gzip;
    default_type application/wasm;
    try_files $uri =404;
}
