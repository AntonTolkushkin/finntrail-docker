include fastcgi_params;
fastcgi_pass php:9000;
fastcgi_index index.php;
fastcgi_keep_conn on;
fastcgi_read_timeout 300s;
fastcgi_send_timeout 300s;

# Override generic values from fastcgi_params with reverse-proxy-aware values.
fastcgi_param HTTP_HOST $http_host;
fastcgi_param SERVER_NAME $host;
fastcgi_param SERVER_PORT $effective_server_port;
fastcgi_param REQUEST_SCHEME $effective_scheme;
fastcgi_param HTTPS $fastcgi_https;
fastcgi_param HTTP_X_FORWARDED_PROTO $effective_scheme;
fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
