root $bitrix_document_root;
index index.php index.html;

# Доверяем заголовку реального IP только от приватных Docker-сетей.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

access_log /var/log/nginx/access.log main;
error_log /var/log/nginx/error.log warn;

error_page 404 @bitrix;
error_page 500 502 503 504 /500.html;

location = /docker-health {
    auth_basic off;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location = /500.html {
    root /opt/www/public_html;
}

include /etc/nginx/inc/intranet.conf;
include /etc/nginx/inc/block.conf;
include /etc/nginx/inc/static.conf;
include /etc/nginx/inc/bx_temp.conf;
# Push&Pull включайте только вместе с отдельными push-sub/push-pub сервисами.
# include /etc/nginx/inc/push.conf;
include /etc/nginx/inc/clouds.conf;
include /etc/nginx/inc/proxy.conf;
include /etc/nginx/inc/dav.conf;

location ~ \.php$ {
    error_page 404 = @php-not-found;
    try_files $uri =404;
    include /etc/nginx/inc/php-fpm.conf;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}

location @php-not-found {
    return 404;
}

location / {
    try_files $uri $uri/ @bitrix;
}

location @bitrix {
    include /etc/nginx/inc/php-fpm.conf;
    fastcgi_param SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
}
