# Installed into /etc/nginx/conf.d by scripts/install-host-edge.sh.
# Exact path matching only. Query strings do not participate in lookup.

map $uri $finntrail_redirect_301 {
    default "";
    include /etc/nginx/finntrail-rules/redirects-301.map;
}

map $uri $finntrail_redirect_302 {
    default "";
    include /etc/nginx/finntrail-rules/redirects-302.map;
}
