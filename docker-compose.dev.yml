services:
  mysql:
    cpus: ${DEV_MYSQL_CPUS:-1.0}
    mem_limit: ${DEV_MYSQL_MEMORY_LIMIT:-1536m}
    mem_reservation: ${DEV_MYSQL_MEMORY_RESERVATION:-768m}
    pids_limit: ${DEV_MYSQL_PIDS_LIMIT:-256}

  redis:
    cpus: ${DEV_REDIS_CPUS:-0.25}
    mem_limit: ${DEV_REDIS_MEMORY_LIMIT:-256m}
    mem_reservation: ${DEV_REDIS_MEMORY_RESERVATION:-128m}
    pids_limit: ${DEV_REDIS_PIDS_LIMIT:-128}

  php:
    cpus: ${DEV_PHP_CPUS:-1.5}
    mem_limit: ${DEV_PHP_MEMORY_LIMIT:-1536m}
    mem_reservation: ${DEV_PHP_MEMORY_RESERVATION:-512m}
    pids_limit: ${DEV_PHP_PIDS_LIMIT:-256}
    environment:
      BITRIX_ENV_TYPE: ${BITRIX_ENV_TYPE:-development}
      SITE_ROOT: /opt/www/dev/public_html
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-4}
      PHP_FPM_START_SERVERS: ${PHP_FPM_START_SERVERS:-1}
      PHP_FPM_MIN_SPARE_SERVERS: ${PHP_FPM_MIN_SPARE_SERVERS:-1}
      PHP_FPM_MAX_SPARE_SERVERS: ${PHP_FPM_MAX_SPARE_SERVERS:-2}
      PHP_FPM_MAX_REQUESTS: ${PHP_FPM_MAX_REQUESTS:-500}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-384M}
    volumes:
      - type: bind
        source: ./confs/php/project-development.ini
        target: /usr/local/etc/php/conf.d/zz-project.ini
        read_only: true
      - type: bind
        source: ./confs/php/fpm-development.conf
        target: /usr/local/etc/php-fpm.d/zz-project.conf
        read_only: true

  cron:
    cpus: ${DEV_CRON_CPUS:-0.25}
    mem_limit: ${DEV_CRON_MEMORY_LIMIT:-384m}
    mem_reservation: ${DEV_CRON_MEMORY_RESERVATION:-128m}
    pids_limit: ${DEV_CRON_PIDS_LIMIT:-128}
    environment:
      BITRIX_ENV_TYPE: ${BITRIX_ENV_TYPE:-development}
      SITE_ROOT: /opt/www/dev/public_html
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-4}
      PHP_FPM_START_SERVERS: ${PHP_FPM_START_SERVERS:-1}
      PHP_FPM_MIN_SPARE_SERVERS: ${PHP_FPM_MIN_SPARE_SERVERS:-1}
      PHP_FPM_MAX_SPARE_SERVERS: ${PHP_FPM_MAX_SPARE_SERVERS:-2}
      PHP_FPM_MAX_REQUESTS: ${PHP_FPM_MAX_REQUESTS:-500}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-384M}
    volumes:
      - type: bind
        source: ./confs/php/project-development.ini
        target: /usr/local/etc/php/conf.d/zz-project.ini
        read_only: true
      - type: bind
        source: ./confs/php/fpm-development.conf
        target: /usr/local/etc/php-fpm.d/zz-project.conf
        read_only: true

  composer:
    working_dir: /opt/www/dev/public_html

  node:
    working_dir: /opt/www/dev/public_html

  nginx:
    cpus: ${DEV_NGINX_CPUS:-0.25}
    mem_limit: ${DEV_NGINX_MEMORY_LIMIT:-256m}
    mem_reservation: ${DEV_NGINX_MEMORY_RESERVATION:-64m}
    pids_limit: ${DEV_NGINX_PIDS_LIMIT:-128}
    volumes:
      - ./confs/nginx/sites/development.conf:/etc/nginx/conf.d/default.conf:ro
